:root{--bg:#1a1b26;--panel:#222432;--card:#2e2f3b;--card2:#292b39;--line:rgba(255,255,255,.095);--text:#f8f8fd;--muted:#b5b7c8;--faint:#85889d;--blue:#4548cc;--blue2:#3538a7;--blue3:#6166ec;--green:#57d4a1;--shadow:0 18px 55px rgba(0,0,0,.24)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% 4%,rgba(82,88,225,.11),transparent 32rem),var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{color:inherit}.page{max-width:1420px;margin:0 auto;padding:0 34px 36px}.hero{position:relative;margin:0 -34px;padding:22px 34px 74px;min-height:166px;overflow:hidden;border-radius:0 0 38px 38px;background:radial-gradient(circle at 85% 25%,rgba(255,255,255,.13) 0 2px,transparent 4px),radial-gradient(circle at 78% 58%,rgba(255,255,255,.095) 0 31px,transparent 34px),radial-gradient(circle at 25% 30%,rgba(255,255,255,.09) 0 39px,transparent 42px),linear-gradient(112deg,#3d43c8 0%,#3738b0 50%,#302e92 100%)}.hero:after{content:"";position:absolute;width:370px;height:370px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:22%;top:-210px;box-shadow:0 0 0 26px rgba(255,255,255,.018),0 0 0 64px rgba(255,255,255,.018);pointer-events:none}.topbar{max-width:1352px;margin:auto;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:.1px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.brand-mark svg{width:23px;height:23px}.top-actions{display:flex;align-items:center;gap:11px}.icon-button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);cursor:pointer;transition:.18s}.icon-button:hover{background:rgba(255,255,255,.17);transform:translateY(-1px)}.icon-button svg{width:22px;height:22px}.user-pill{display:flex;align-items:center;gap:9px;margin-right:8px;padding:5px 12px 5px 7px;border:1px solid rgba(255,255,255,.16);border-radius:30px;background:rgba(255,255,255,.08);font-size:14px}.avatar{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(145deg,#ffb870,#df5b92 57%,#625ce3);border:2px solid rgba(255,255,255,.27);box-shadow:0 3px 12px rgba(0,0,0,.18)}.avatar.small{width:48px;height:48px;font-size:16px}.avatar.big{width:52px;height:52px;font-size:18px}.avatar.violet{background:linear-gradient(140deg,#55c7f2,#5653d8 65%,#8b58dd)}.avatar.green{background:linear-gradient(140deg,#5fe0b1,#27a78c 60%,#246b83)}.avatar.orange{background:linear-gradient(140deg,#ffe18b,#f58c52 55%,#d45582)}.avatar.pink{background:linear-gradient(140deg,#ffb7d5,#d05caa 60%,#6555d7)}.avatar.blue{background:linear-gradient(140deg,#73d2ff,#4274e6 62%,#493bb8)}

 omar:{name:'مجموعة النسور',status:'مجموعة تجريبية',tone:'orange',group:true,messages:[['in','أحمد','خلصتوا الواجب يا جماعة؟','٣:٥٢ م'],['out','أنت','خلصت التمرين الأول، وبراجع التاني.','٣:٥٤ م']]},

 friends:{name:'مجموعة الياسمين',status:'مجموعة تجريبية',tone:'pink',group:true,messages:[['in','هنا','نراجع الواجب مع بعض؟','أمس'],['out','أنت','فكرة حلوة، بعد الحصة؟','أمس']]},
 sara:{name:'رسائل المس',status:'دردشة تجريبية',tone:'blue',messages:[['in','مس أسماء','برافو، شغلك ممتاز.','أمس'],['out','أنت','تمام، شكراً يا مس 🙏','أمس']]},
 bio:{name:'مجموعة المراجعة',status:'مجموعة تجريبية',tone:'green',group:true,messages:[['in','مس أسماء','موعد المراجعة بكرة.','الأحد'],['out','أنت','حاضر يا مس.','الأحد']]}
};
const list=document.getElementById('conversationList'),layout=document.getElementById('chatLayout'),messages=document.getElementById('messages'),search=document.getElementById('chatSearch');let active='chem',filter='all';
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawChat(id){const d=data[id];if(!d)return;active=id;document.getElementById('chatName').textContent=d.name;document.getElementById('chatStatus').textContent=d.status;messages.innerHTML='<div class="day-label">اليوم</div>'+d.messages.map(m=>`<div class="msg-row ${m[0]==='out'?'outgoing':'incoming'}"><div class="bubble">${escapeHtml(m[2])}<div class="bubble-meta"><span>${escapeHtml(m[3])}</span>${m[0]==='out'?'<span class="read-mark">✓✓</span>':''}</div></div></div>`).join('');document.querySelectorAll('.conversation').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));messages.scrollTop=messages.scrollHeight;if(matchMedia('(max-width:760px)').matches)layout.classList.add('chat-active-mobile')}
list.addEventListener('click',e=>{const row=e.target.closest('.conversation');if(row)drawChat(row.dataset.id)});
document.getElementById('backButton').addEventListener('click',()=>layout.classList.remove('chat-active-mobile'));
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');filter=btn.dataset.filter;applyFilters()}));
function applyFilters(){const q=search.value.trim().toLocaleLowerCase('ar');let shown=0;document.querySelectorAll('.conversation').forEach(row=>{const d=data[row.dataset.id];const okFilter=filter==='all'||(filter==='groups'&&row.dataset.kind==='groups')||(filter==='unread'&&Number(row.dataset.unread)>0);const okQuery=(d.name+' '+row.querySelector('.conv-preview').textContent).toLocaleLowerCase('ar').includes(q);row.style.display=okFilter&&okQuery?'flex':'none';if(okFilter&&okQuery)shown++});document.getElementById('emptyState').classList.toggle('show',shown===0)}
search.addEventListener('input',applyFilters);
document.getElementById('messageForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('messageInput');const text=input.value.trim();if(!text)return;const time=new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit'}).format(new Date());data[active].messages.push(['out','أنت',text,time]);drawChat(active);input.value='';input.focus()});
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
document.querySelectorAll('.nav-item').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));a.classList.add('active');toast('القسم: '+a.innerText.trim())}));
drawChat('chem');
</script></body></html>
