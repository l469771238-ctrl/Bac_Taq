name: bootstrap-tools
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/bootstrap.yml']

permissions:
  contents: write

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1b4871f2-bac-taq
      - name: fetch apktool
        run: |
          mkdir -p buildtools
          curl -sSL -o buildtools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          ls -la buildtools/
          unzip -l buildtools/apktool.jar | grep -iE "framework|aapt|android" | head -20
          echo "--- sizes ---"
          unzip -l buildtools/apktool.jar | sort -k1 -n | tail -8
      - name: push
        run: |
          git config user.email ci@agents.local
          git config user.name "Bac-Taq CI"
          git add -f buildtools
          git commit -m "chore: bootstrap build tools [skip ci]" || echo "no changes"
          git pull --rebase origin arena/1b4871f2-bac-taq || true
          git push origin HEAD:arena/1b4871f2-bac-taq
