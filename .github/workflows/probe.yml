name: probe-books
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1b4871f2-bac-taq

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ghostscript >/dev/null
          pip3 install --quiet pypdf pillow

      - name: fetch + analyze
        run: |
          mkdir -p probe_out/covers
          curl -sSL -A "Mozilla/5.0" "https://drive.google.com/embeddedfolderview?id=1V7hPlrPv2AlmKeHMhkDYqjyQWbAytT5x#list" -o /tmp/list.html
          python3 - <<'PY'
          import re, json
          html = open('/tmp/list.html', encoding='utf-8', errors='replace').read()
          pairs = re.findall(r'/file/d/([-\w]{28,})/.*?flip-entry-title">([^<]*)<', html, re.S)
          if not pairs:
              ids = re.findall(r'/file/d/([-\w]{28,})/', html)
              names = re.findall(r'flip-entry-title">([^<]*)<', html)
              pairs = list(zip(ids, names))
          json.dump(pairs, open('/tmp/files.json','w'), ensure_ascii=False)
          print(pairs)
          PY
          python3 - <<'PY'
          import json, subprocess, os
          files = json.load(open('/tmp/files.json'))
          meta = []
          for i,(fid,name) in enumerate(files):
              dest = f'/tmp/book{i+1}.pdf'
              url = f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t'
              subprocess.run(['curl','-sSL','-A','Mozilla/5.0','-o',dest,url], check=True)
              size = os.path.getsize(dest)
              info = subprocess.run(['pdfinfo',dest], capture_output=True, text=True).stdout
              pages = 0
              for line in info.splitlines():
                  if line.startswith('Pages:'): pages = int(line.split()[1])
              txt = subprocess.run(['pdftotext','-f','1','-l','3',dest,'-'], capture_output=True, text=True).stdout
              subprocess.run(['pdftoppm','-jpeg','-f','1','-l','1','-scale-to','720','-jpegopt','quality=82',dest,f'probe_out/covers/cover{i+1}'], check=False)
              gs_out = f'/tmp/book{i+1}_small.pdf'
              subprocess.run(['gs','-q','-dNOPAUSE','-dBATCH','-sDEVICE=pdfwrite','-dPDFSETTINGS=/ebook',f'-sOutputFile={gs_out}',dest], check=False)
              gs_size = os.path.getsize(gs_out) if os.path.exists(gs_out) else -1
              meta.append(dict(idx=i+1, drive_id=fid, drive_name=name, bytes=size, pages=pages, gs_ebook_bytes=gs_size, text_sample=txt[:600]))
          json.dump(meta, open('probe_out/meta.json','w'), ensure_ascii=False, indent=1)
          print(json.dumps(meta, ensure_ascii=False, indent=1)[:4000])
          PY
          ls -la probe_out/covers

      - name: push result
        run: |
          git config user.email ci@agents.local
          git config user.name "CI"
          git add probe_out
          git commit -m "ci: probe output [skip ci]" || echo "nothing to commit"
          git pull --rebase origin arena/1b4871f2-bac-taq || true
          git push origin HEAD:arena/1b4871f2-bac-taq && echo PUSH_OK || echo PUSH_FAIL
