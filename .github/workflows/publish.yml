name: publish-release
on:
  workflow_dispatch:
  push:
    tags: ['v2*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BAC_VERSION: '1.8'
      Z_VERSION: '0.4'
    steps:
      - uses: actions/checkout@v4

      - name: verify both APKs
        run: |
          set -e
          ls -la dist/
          python3 - <<'PY'
          import zipfile, sys
          apps = {
            'dist/Bac-Taq-%s.apk' % __import__('os').environ['BAC_VERSION']: 'Bac-Taq',
            'dist/Z-Project-%s.apk' % __import__('os').environ['Z_VERSION']: 'Z-Project',
          }
          ok = True
          for apk, name in apps.items():
              z = zipfile.ZipFile(apk)
              print(name, '->', len(z.infolist()), 'entries, corrupt:', z.testzip())
              names = set(z.namelist())
              need = ['AndroidManifest.xml', 'classes.dex', 'resources.arsc',
                      'assets/web/index.html', 'assets/web/js/app.js']
              bad = [n for n in need if n not in names]
              bad += [n for n in names if n.startswith('web/')]
              bad += [n for n in names if n.startswith(('assets/web/tests', 'assets/web/node_modules'))]
              if bad:
                  print('  PACKAGING BROKEN:', bad[:8]); ok = False
          sys.exit(0 if ok else 1)
          PY
          sha256sum dist/Bac-Taq-*.apk dist/Z-Project-*.apk

      - name: publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bac-Taq 1.8 + Z-Project 0.4 — تطبيقين
          body_path: dist/release-notes.md
          files: |
            dist/Bac-Taq-1.8.apk
            dist/Z-Project-0.4.apk
          fail_on_unmatched_files: true
          make_latest: true
