name: publish-release
on:
  workflow_dispatch:
  push:
    tags: ['v1.1', 'v1.2', 'v1.3', 'v1.4', 'v1.5', 'v1.6', 'v1.7', 'v1.8']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: '1.7'
    steps:
      - uses: actions/checkout@v4

      - name: verify apk
        run: |
          set -e
          ls -la dist/
          APK="dist/Bac-Taq-$VERSION.apk"
          sha256sum "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          print('zip entries', len(z.infolist()), 'corrupt:', z.testzip())
          names = set(z.namelist())
          # Android's AssetManager only sees files under assets/ — a top-level
          # "web/" tree makes every page 404 ("Not found"). Fail loudly.
          need = ['AndroidManifest.xml', 'classes.dex', 'resources.arsc',
                  'assets/web/index.html', 'assets/web/js/app.js', 'assets/web/js/security.js',
                  'assets/web/css/app.css', 'assets/web/books/meta.json',
                  'assets/web/js/vendor/pdf.worker.min.js',
                  'assets/web/books/arabic.pdf', 'assets/web/books/english.pdf',
                  'assets/web/books/history.pdf', 'assets/web/books/programming.pdf']
          bad = [n for n in need if n not in names]
          bad += [n for n in names if n.startswith('web/')]
          if bad:
              print('PACKAGING BROKEN:', bad[:10]); sys.exit(1)
          print('packaging OK')
          PY
          grep -c "verifyInvite\|makeInvite" dist/../app/web/js/security.js && exit 1 || echo "no device-key code shipped"

      - name: publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7
          name: Bac-Taq 1.4 — التطبيق
          body_path: dist/release-notes.md
          files: dist/Bac-Taq-1.7.apk
          fail_on_unmatched_files: true
          make_latest: true
